name: notify
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['notify/check.mjs']
permissions:
  contents: write
concurrency: notify
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node notify/check.mjs
        env:
          BENCH_CODE: ${{ secrets.NOTIFY_TOKEN || secrets.BENCH_CODE }}
      # 17.11.2026 (Yoni approved notifications): the day's one notification to each coordinator's phone (target dates that fall
      # today, cases three days old with no update). The site sends at most one a day each. 28.11.2026 (Yoni): only Sunday to
      # Thursday, 9:00 to 18:00; target dates that fall on Friday or Saturday are told on Thursday from 15:00
      - run: |
          curl -sS -m 60 -X POST "https://takanon-site.pages.dev/api/push" -H "Content-Type: application/json" -H "X-Code: $(node -e 'process.stdout.write(encodeURIComponent(process.env.BENCH_CODE || ""))')" -d '{"op":"tick"}' -o /dev/null -w "push tick: %{http_code}\n" || true
        env:
          BENCH_CODE: ${{ secrets.NOTIFY_TOKEN || secrets.BENCH_CODE }}
      - run: |
          git config user.name "notify" && git config user.email "notify@users.noreply.github.com"
          git add notify
          git diff --cached --quiet && exit 0
          git commit -qm "בדיקת מקרים חדשים [CI Skip]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
