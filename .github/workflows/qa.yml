name: qa
on:
  push:
    branches: [main]
    paths: ['audit/qa_request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.52.0-noble
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && cd /tmp && npm init -y >/dev/null && npm i playwright@1.52.0
      - run: node audit/qa.mjs
        env:
          BENCH_CODE: ${{ secrets.BENCH_TOKEN || secrets.BENCH_CODE }}
      - if: always()
        run: |
          git config user.name "audit-bot" && git config user.email "audit-bot@users.noreply.github.com"
          git add -A audit
          git commit -m "בדיקת איכות (סוכנים): תוצאות [CI Skip]" || echo "nothing to commit"
          git pull --rebase origin main && git push
