name: regwatch-alert
# Every Sunday: opens a GitHub issue, assigned to the repo owner, when the
# weekly check found a change or stopped running. URLs and document names only.
on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)

          def when(text):
              return datetime.fromisoformat(text.replace('Z', '+00:00'))

          def issue(title, body):
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body,
                              '--assignee', 't4fpz2tvth-a11y'], check=True)

          # 17.11.2026: the weekly look is now watch/run.mjs (130 sources, the faculties' pages too, and a note of what changed);
          # the older regwatch/check.mjs no longer runs on a schedule. The findings: watch/changes.json, watch/last.json
          rows = []
          if os.path.exists('watch/changes.json'):
              rows = json.load(open('watch/changes.json', encoding='utf8'))
          recent = [r for r in rows if when(r['t']) >= now - timedelta(days=7)]
          if recent:
              word = {'changed': 'השתנה', 'lost': 'לא נגיש כבר שתי בדיקות', 'back': 'חזר לעלות'}
              lines = []
              for r in recent:
                  note = (' (' + r['note'][:300] + ')') if r.get('note') else ''
                  lines.append(f"- {word.get(r.get('kind'), r.get('kind'))}: {r.get('name', '')} {r.get('url', '')}{note}")
              issue('בוט התקנון: שינוי באתרי התקנונים',
                    'בבדיקה השבועית של דפי המקור של התקנונים נמצא:\n\n'
                    + '\n'.join(lines)
                    + '\n\nכדאי לבדוק מה השתנה, ואם זה עדכון של תקנון, להעלות את הקובץ או את הקישור '
                      'לשיחה עם קלוד כדי לעדכן את המאגר. הרשימה המלאה: בבוט הרכזים, "ניהול", "שינויים בתקנונים".')

          stale = True
          if os.path.exists('watch/last.json'):
              try:
                  stale = now - when(json.load(open('watch/last.json', encoding='utf8'))['t']) > timedelta(days=8)
              except Exception:
                  stale = True
          if stale:
              issue('בוט התקנון: הבדיקה השבועית לא רצה',
                    'לא נמצאה ריצה של הבדיקה השבועית בשמונת הימים האחרונים.')
          PY
