name: regwatch
on:
  schedule:
    - cron: '17 5 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency: regwatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node regwatch/check.mjs
      - run: |
          git config user.name "regwatch" && git config user.email "regwatch@users.noreply.github.com"
          git add regwatch
          git diff --cached --quiet && exit 0
          git commit -qm "בדיקת שינויים בתקנונים [CI Skip]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
