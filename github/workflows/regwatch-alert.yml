name: regwatch-alert
# Every Sunday: opens a GitHub issue, assigned to the repo owner, when the
# weekly check found a change or stopped running. URLs and document names only.
on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from datetime import datetime, timedelta, timezone

          now = datetime.now(timezone.utc)

          def when(text):
              return datetime.fromisoformat(text.replace('Z', '+00:00'))

          def issue(title, body):
              subprocess.run(['gh', 'issue', 'create', '--title', title, '--body', body,
                              '--assignee', 't4fpz2tvth-a11y'], check=True)

          rows = []
          if os.path.exists('regwatch/changes.json'):
              rows = json.load(open('regwatch/changes.json', encoding='utf8'))
          recent = [r for r in rows if when(r['at']) >= now - timedelta(days=7)]
          if recent:
              lines = []
              for r in recent:
                  docs = r.get('docs', '')
                  docs = ', '.join(docs) if isinstance(docs, list) else str(docs)
                  kind = '(קובץ PDF)' if r.get('kind') == 'pdf' else '(עמוד באתר)'
                  lines.append(f"- {docs} {kind} {r.get('url', '')}")
              issue('בוט התקנון: שינוי באתרי התקנונים',
‎                    'בבדיקה השבועית נמצא שינוי בעמודים הרשמיים של המסמכים הבאים:\n\n'
                    + '\n'.join(lines)
                    + '\n\nכדאי לבדוק מה השתנה, ואם זה עדכון של תקנון, להעלות את הקובץ או את הקישור '
‎                      'לשיחה עם קלוד כדי לעדכן את המאגר. בעמוד אתר ייתכן שינוי שאינו בתקנון עצמו (חדשות, עיצוב).')

          stale = True
          if os.path.exists('regwatch/last_check.txt'):
              found = re.match(r'\s*(\d{4}-\d{2}-\d{2})', open('regwatch/last_check.txt', encoding='utf8').read())
              if found:
                  checked = datetime.fromisoformat(found.group(1)).replace(tzinfo=timezone.utc)
                  stale = now - checked > timedelta(days=8)
          if stale:
              issue('בוט התקנון: הבדיקה השבועית לא רצה',
‎                    'לא נמצאה ריצה של הבדיקה השבועית בשמונת הימים האחרונים.')
          PY
