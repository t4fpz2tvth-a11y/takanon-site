<script>
const CASES = [{"id": "AD03", "q": "הטיפול של האגודה במקרה הסתיים, אבל החלטת האוניברסיטה עדיין ממתינה. נבדוק שוב בעוד שבוע. איך לרשום את המקרה?", "expect": "ChatGPT: סטטוס טיפול סגור, תוצאה ממתינה ומעקב פתוח; לא לספור כהצלחה או כמקרה חדש. אצלנו: סטטוס \"נסגר\" בלי תוצאה ותאריך ב\"יעד מעקב\"; אצל רמ\"ח המקרה תחת \"מעקב אחרי סגירה\" (נבדק אוטומטית).", "src": "academy_cases.json"}, {"id": "AC05", "q": "הודעת מזכירות החוג, לגבי הקורס \"מבוא לכלכלה\" בלבד: הציונים יפורסמו ב-2.11.2026, ערעור עד 5.11, תשובות לערעורים עד 9.11, ובקשה למועד מיוחד עד 12.11. הסטודנטית שואלת עד מתי היא יכולה לערער על הציון.", "expect": "ChatGPT: להפריד פעולות ותאריכים ולהגביל תחולה לקורס; לא להחליף את מועד הערעור ב-12.11. אצלנו: מועד הערעור 5.11 לפי ההודעה (מקור: ההודעה), ו-12.11 רק לבקשה למועד מיוחד.", "src": "academy_cases.json"}, {"id": "AD05", "q": "המרצה הציע לסטודנט מטלה חלופית במקום הבחינה שהחמיץ. לא ידוע אם המטלה הוגשה ואם הציון עודכן. אפשר לסגור את המקרה?", "expect": "ChatGPT: להבחין בין פתרון מוצע למימוש מאומת; לא לסגור כהצלחה.", "src": "academy_cases.json"}, {"id": "AD13", "q": "ניסינו להגיש את הבקשה בטופס המקוון של הפקולטה, והטופס הציג שגיאת מכסה בזמן צירוף הקובץ. הבקשה נקלטה?", "expect": "ChatGPT: לא להציג אישור קליטה; להציע דרך חלופית שנבדקה. בדיקת שירות חיה נפרדת נדרשת.", "src": "academy_cases.json"}, {"id": "AC02", "q": "הגשנו ערעור על הציון בשם הסטודנטית ומחכים לתשובה. סיימנו כרגע את חלקנו בהגשה. מה הסטטוס של המקרה ומה הלאה?", "expect": "ChatGPT: לא לסמן זכייה, אישור ערעור או סגירת המקרה; להבחין בהמתנה. אצלנו: הסטטוס המתאים הוא \"הוגש ערעור\", בלי תוצאה.", "src": "academy_cases.json"}, {"id": "AC03", "q": "סטודנט מדווח שבמועד א' בקורס \"כלכלה ציבורית\" קיצרו את זמן הבחינה בחצי שעה בלי הודעה מראש, והוא לא הספיק לסיים. הוא רוצה לדעת מה אפשר לעשות.", "expect": "ChatGPT: לעדכן סיכום וטיוטה, להציג את מקור העדכון ואת הצורך באימות, ולא לטעון להפרה מוכחת. אצלנו: בתשובה לשאלת ההמשך הקיצור הוא טענה שלא אומתה (נמסר בעל פה שלא השתנה), בלי קביעה שהייתה הפרה.", "src": "academy_cases.json"}, {"id": "G02", "q": "סטודנטית בבית הספר לחינוך ילדה ב-10.9.2026. מועד ההגשה של עבודת סיום הקורס (קורס מסמסטר ב') היה 20.9.2026 והיא לא הגישה. המרצה כתב לה במייל שמי שלא הגיש במועד מקבל 0. היא שואלת מה הזכויות שלה ועד מתי היא יכולה להגיש.", "expect": "לא להניח שהסטודנטית הוכרה כזכאית לפי 1.12.3 ולא שניתן ציון 0 (המרצה 'כתב' – [נמסר]). לענות על תנאי: אם הוכרה – 8.2.2.4 ונספח ד' 3(א): הגשה תוך שבעה שבועות מתום תקופת ההיעדרות (עוגן לא ידוע – לא ניתן לחשב); נספח ד' כללי: בקשה בכתב לרכזת הורות עם אישורים, זכאות אחרי 21 ימי היעדרות; 6.2.4(ב); 8.2.2. לשאול אם פנתה לרכזת הורות. בהבהרה: להגיש עכשיו לרכזת מגדר והורות ולמרצה בכתב, בלי להבטיח ובלי לקבוע שאבוד. מסלול: ליווי. המלכודת: עובדה מכריעה חסרה – ההכרה.", "src": "agent_cases.json"}, {"id": "G03", "q": "היי, אני שנה א' בכלכלה. הייתי במילואים 16 יום בתחילת הסמסטר והפסדתי 3 תרגולים בסטטיסטיקה. המתרגל אמר בכיתה שמי שחסר יותר משני תרגולים לא ניגש למבחן. גם חבר שלי מהקורס היה במילואים (6 ימים) והפסיד 2 תרגולים והמתרגל אמר לו שהוא \"גבולי\". אפשר לפתוח לנו מקרה אחד ולטפל בשנינו ביחד?", "expect": "מקרה אחד = סטודנט אחד: האבחון לכותב בלבד; החבר (6 ימים, 2 תרגולים) נשאר בתיק נפרד עם העובדות שלו, לכל היותר ראיה; מותר לשאול אם המקרה רוחבי. דברי המתרגל – [נמסר], לא החלטה. סעיפים: 6.2.1 ו-6.2.3 (נוכחות לא תיאכף על משרת מילואים, חובת השלמה), 6.2.4(ב), 6.2.5, נספח ה' סעיף 2(א), סעיף 7(ג)–(ד) (לא חל על תרגול מעשי), 1.12.4 או נספח ה' סעיף 1(ב); לא להחיל את מתווה תשפ\"ו כהסדר קבוע. צעד: פנייה בכתב למורה הקורס עם האישור, ולרכז/ת המילואים. מסלול: ליווי · פרטני. המלכודת: שני סטודנטים בהודעה אחת.", "src": "agent_cases.json"}, {"id": "G05", "q": "היי, אני שנה ג' בחוג לכימיה (מדעי הטבע). עברתי קורס חובה ב-64 ורוצה לחזור עליו כדי לשפר ציון לקראת תואר שני. בשנה ב' כבר חזרתי על שני קורסים לשיפור ציון. ראש החוג כתב לי שניצלתי את שתי החזרות המותרות בפקולטה. קראתי בנה\"ל שאפשר לחזור על קורס לשיפור ציון באישור ועדת הוראה ואין שם הגבלה על מספר הקורסים. זה לא סותר? מה גובר?", "expect": "קודם הכלל הפקולטטי (נהלי הפקולטה למדעי הטבע 10.4: ראש החוג מאשר חזרה לשיפור ציון; 'לא יינתן אישור לחזרה על יותר משני קורסים'), ואז נה\"ל 10.1(ב) (שיפור ציון באישור ועדת הוראה, שרשאית לסרב) ו-10.4.2 (הפקולטה רשאית להגביל את מספר החזרות) – ההגבלה הפקולטטית מכוח נה\"ל, לא סתירה; 10.3 (הציון המאוחר קובע); 10.1 (רישום ושכ\"ל). לא לומר שנה\"ל מקנה זכות בלי הגבלה ולא להכריע שהכלל הפקולטטי בטל. צעד: בקשה מנומקת לוועדת ההוראה, בלי הבטחה. מסלול: ליווי או מעקב מהצד. המלכודת: 'מה גובר'.", "src": "agent_cases.json"}, {"id": "G01", "q": "היי, אני שנה ב' בפסיכולוגיה (מדעי החברה). ביקשתי ממזכירות החוג לבטל לי קורס בחירה אחד מהמערכת ולהוריד בהתאם את החלקיות של שכר הלימוד, וקיבלתי במייל שורה אחת: \"הבקשה לא אושרה\". בלי שום הסבר למה. מה אפשר לעשות עם זה?", "expect": "לא להסיק מהסירוב שתקופת השינויים חלפה או שהבקשה לא מוצדקת; שורה תחתונה: העילה לא ידועה ויש לדרוש אותה בכתב, ולדון בכל עילה אפשרית בנפרד. סעיפים: 4.2.1 (שינויים בשבועיים הראשונים; קורס שנתי רק בסמסטר א'), 4.2.2, 4.3.3 או 4.5.2 (אחרי המועד אין ביטול ואין הקטנת חלקיות; חריגים – ועדת הערעורים לשכר לימוד), 4.1.4, 19.2.1–19.2.2. לא אומת: מתי הוגשה הבקשה ביחס לתקופת השינויים; קורס סמסטריאלי או שנתי. צעד: בקשה בכתב למזכירות החוג לנימוק, ואז לפי העילה. מסלול: ליווי · פרטני; בלי רמ\"ח. המלכודת: סירוב בלי נימוק.", "src": "agent_cases.json"}, {"id": "G08", "q": "שלום, היה לי דיון אצל הממונה על המשמעת בגלל חשד להעתקה בבחינה (טענו שהיה לי דף עם חומר). ביום חמישי 8.10 נשלח לי למייל האוניברסיטאי פסק הדין: פסילת הבחינה והרחקה מהלימודים לסמסטר ב'. ראיתי את המייל רק אתמול (20.10) כי אני לא נכנס למייל האוניברסיטאי. אני רוצה לערער. יש לי עוד זמן? ומה עם הקורסים שלי בסמסטר ב'?", "expect": "[נמסר] בלבד, אין קובץ. העוגן לערעור הוא 08.10.2026 – משמעת 61 (הודעה למייל האוניברסיטאי נחשבת שהומצאה), לא 20.10; 42 (20 יום ממסירת פסק הדין), 60(א)–(ג) (יום המסירה לא נמנה; ימי מנוחה נמנים אלא אם אחרונים), 43 (הודעה מנומקת למזכיר ועדת הערעורים), 59 (הארכה מטעמים מיוחדים), 37 (עיכוב ביצוע), 35(ב), 17(4) ו-17(11), 22, 31. בלי לחשב תאריך ובלי להבטיח שבזמן. בהבהרה: מילואים לא מזיזים את העוגן – רק בקשת הארכה לפי 59, בלי הבטחה. מאשר: מזכירת ועדת המשמעת מהרשימה. 'לתשומת לב רמ\"ח' (סכנת הפסקת לימודים). מסלול: ייצוג. המלכודת: מסירה למייל.", "src": "agent_cases.json"}, {"id": "G09", "q": "שלום, היה לי דיון אצל הממונה על המשמעת על חשד להעתקה בעבודה. פסק הדין (פסילת העבודה ונזיפה) נשלח ב-8.10 למייל הפרטי שלי בג'ימייל ולא למייל האוניברסיטאי, ונפל לספאם. ראיתי אותו רק ב-20.10. אני רוצה לערער, יש לי עוד זמן?", "expect": "מראה של G08: כאן ההודעה לא נשלחה למייל האוניברסיטאי, ולכן 61 לא קובע את יום המסירה; לא להניח שהמסירה ב-8.10 וגם לא ב-20.10 כוודאות: מתי פסק הדין נמסר בפועל הוא הנקודה שלא אומתה. סעיפים: 42 (20 יום ממסירת פסק הדין), 43 (הודעה מנומקת בכתב למזכיר ועדת הערעורים), 60 (מניין הימים), 59 (הארכה מטעמים מיוחדים, בלי להבטיח), 37 (עיכוב ביצוע). בלי לחשב תאריך כוודאי. צעד: להגיש ערעור מיד, ובמקביל בקשת הארכה לפי 59. מסלול: ייצוג. המלכודת: להחיל את 61 על מייל פרטי.", "src": "agent_cases2.json"}, {"id": "G13", "q": "יש לי אישור מיחידת הנגישות על 25% תוספת זמן בבחינות. בבחינה הסופית בסטטיסטיקה במועד א' המשגיחה אמרה שאין לה הוראה כזו ולא נתנה לי את התוספת, וסיימתי רק חצי מהבחינה. מה עושים?", "expect": "מראה של AD14 בבחינה סופית: אי-יישום של התאמה מאושרת, לא בקשת זכאות חדשה; נוהל התאמות הנגישות 12 (יישום עד 45 יום מההחלטה) ו-7.6 (התאמות בבחינות); תלונה בכתב לגורם שחרג (19.2.1) ולמזכירות ההוראה, עם האישור; לא להפנות לערר לפי סעיף 9 (הוא נגד החלטת היחידה). לא להבטיח מועד חוזר או ציון: אם מבקשים סעד, לנסח כבקשה. מסלול: ייצוג או ליווי, עם נימוק; בלי רמ\"ח אלא אם יש סכנה ללימודים. המלכודת: להפוך את המקרה לבקשת זכאות.", "src": "agent_cases2.json"}, {"id": "G15", "q": "סטודנטית בפקולטה למדעי הרוח ילדה ב-1.9.2026, נעדרה חמישה שבועות, והוכרה כזכאית על ידי רכזת ההורות בדיקנט לפני הלידה. מועד ההגשה של עבודת סיום הקורס היה 20.9.2026 והיא לא הגישה. המרצה כתב לכל הכיתה שמי שלא הגיש במועד מקבל 0. מה הזכויות שלה ועד מתי היא יכולה להגיש?", "expect": "מראה של G02: כאן ההכרה לפי 1.12.3 נמסרה וההיעדרות (חמישה שבועות) עולה על 21 ימים. השורה הראשונה עונה ישירות: לפי 8.2.2.4 אפשר להגיש את המטלה או מטלה חלופית, בהתאם להחלטת המורה, תוך שבעה שבועות מתום תקופת ההיעדרות; ההודעה הכללית של המרצה לא מכריעה לגבי סטודנטית שהוכרה. לא 'תלוי בהכרה'. בלי לחשב תאריך סופי (עוגן: תום ההיעדרות, כלל: 7 שבועות). צעד: פנייה בכתב למרצה עם אישור ההכרה. מסלול: ליווי · פרטני. המלכודת: להפוך את התנאי שכבר מולא ל'תלוי'.", "src": "agent_cases3.json"}, {"id": "med-clinical-birth", "q": "אני סטודנטית לרפואה בשנה ה', ילדתי ונעדרתי 5 שבועות מסבב. אני חייבת להשלים, או שיש פטור?", "expect": "צריך להשלים: בשנים הקליניות חל נוהל ביה\"ס לרפואה ולא סעיפי ההשלמה/הפטור הכלליים של נספח ד' (נספח ד' סעיף 2, השורה האחרונה). בשנה ה': השלמה במהלך השנה בהצטרפות לקבוצה אחרת על חשבון חופשה, או על חשבון אלקטיב אחד עד שלושה בשנה ו', עם פטור מהשלמת אלקטיב אחד. פונים לנציגת הדיקן.", "src": "cases.json"}, {"id": "law-appeal-deadline", "q": "אני במשפטים. עד מתי אפשר לערער על ציון בבחינה?", "expect": "בתקנון הפקולטה למשפטים: 48 שעות מהמועד שבו המחברות זמינות או מפרסום הפתרון, המאוחר מביניהם, בעילום שם בטופס באתר הפקולטה (פרק ח' 6.3). בנה\"ל: 3 ימי עבודה מפרסום המחברות (7.11.3), והפקולטה רשאית להאריך (7.11.6). יש פער, והתקנון של משפטים בנוסח 2024 ושחולץ מ-PDF. כדי להיות בטוחים מגישים תוך 48 שעות.", "src": "cases.json"}, {"id": "spouse-child-15", "q": "בעלי שירת 25 ימי מילואים הסמסטר, ויש לנו ילד בן 15. מגיע לי להיעדר משיעורים בבוקר עד 10:30?", "expect": "לא. הזכות להיעדר עד 10:30 (נספח ה', בני זוג, סעיף 1(א)) ניתנת ל'סטודנט הורה', ובהגדרות בפתיחת נספח ה' סטודנט הורה הוא הורה לילד שטרם מלאו לו 13. עם ילד בן 15 הזכות לא חלה.", "src": "cases.json"}, {"id": "not-in-corpus", "q": "מותר להחזיק כלב בחדר במעונות?", "expect": "המשפט הקבוע 'לא מצאתי בתקנונים שבמאגר תשובה ישירה...' ושורת צעד הבא. בלי להמציא כללים.", "src": "cases.json"}, {"id": "V07", "q": "אני דוקטורנטית במדעי הרוח וילדתי. האם המלגה שלי ממשיכה בזמן ההיעדרות?", "expect": "לא להחיל נוהל של בית הספר לרוקחות על מדעי הרוח בלי סימון; לומר מה נמצא ומה לא", "src": "fresh_cases.json"}, {"id": "V01", "q": "ברפואת שיניים נכשלתי במועד א בקורס שהוא תנאי מעבר, ואת מועד ב החמצתי כי הייתי במילואים 8 ימים. אפשר להתחיל את השנה הבאה בינתיים?", "expect": "שרשרת: תנאי מעבר (לפי השאלה/תקנון) + החמצת מועד בשל מילואים -> לימוד על תנאי (נספח ה' 6); לא לומר שתנאי המעבר לא מוכח", "src": "fresh_cases.json"}, {"id": "W02", "q": "שירתתי 20 ימי מילואים במהלך קורס שנתי ולא נבחנתי בו. אם אחזור עליו בשנה הבאה, אצטרך לשלם?", "expect": "לא: 10.1.1 / נספח ה' 2(ד) – 20 ימים בקורס שנתי ולא נבחן; אין כרטיס תשלום בלתי מסויג", "src": "fresh2_cases.json"}, {"id": "W08", "q": "מותר להביא כלב לקמפוס הר הצופים?", "expect": "לא נמצא; לא לנתב לוועדת הוראה; לומר שאין גורם מאומת ולהציע את האגודה", "src": "fresh2_cases.json"}, {"id": "W06", "q": "לפי סעיף 10.1.7 בנה״ל מותר לחזור על קורס חמש פעמים בחינם. זה נכון?", "expect": "אין סעיף כזה; להציג את כללי 10.1 האמיתיים; כותרת ציטוט רק עם מספר אמיתי", "src": "fresh2_cases.json"}, {"id": "X01", "q": "אני בחקלאות. לא עברתי קורס שהוא דרישת קדם לשנה ב', כי בזמן מועד ב הייתי במילואים. אפשר להמשיך לשנה ב' בינתיים?", "expect": "שרשרת: דרישה מוקדמת/תנאי מעבר + היעדרות ממועד בשל מילואים -> לימוד על תנאי (נספח ה' 6); לשאול רק על מה שחסר", "src": "fresh3_cases.json"}, {"id": "X05", "q": "בפקולטה למשפטים, עד מתי מערערים על ציון של עבודה סמינריונית?", "expect": "לא להחיל מועד של ערעור על בחינה על עבודה בלי סעיף; להציג מה שנמצא ומה לא", "src": "fresh3_cases.json"}, {"id": "H07", "q": "בנספח ה' סעיף 14 כתוב שמשרתי מילואים מקבלים פטור משכר לימוד. זה נכון?", "expect": "אין סעיף 14 כזה; לא לייחס", "src": "holdout_cases.json"}, {"id": "H01", "q": "קיבלתי צו 8 ופספסתי שבוע של שיעורים בקורס שנתי, 9 ימים בסך הכול. אוכל לחזור על הקורס בשנה הבאה בלי לשלם?", "expect": "לא לפי 10.1.1: קורס שנתי דורש 20 ימים; 9 לא מספיק (אין לומר שאין תשלום)", "src": "holdout_cases.json"}, {"id": "H02", "q": "הייתי 10 ימים במילואים בסמסטר הזה בקורס סמסטריאלי, ולא ניגשתי עדיין לבחינה. מה מצב שכר הלימוד אם אחזור על הקורס?", "expect": "חוזרים בלי תשלום נוסף (10.1.1; נספח ה' 2(ד))", "src": "holdout_cases.json"}, {"id": "P01", "q": "שירתתי 20 ימי מילואים במהלך קורס שנתי ולא נבחנתי בו. אם אחזור עליו בשנה הבאה, אצטרך לשלם?", "expect": "W02 כלשונה: אין תשלום (10.1.1 / נספח ה' 2(ד)); המילה הראשונה 'לא'", "src": "pay_cases.json"}, {"id": "P09", "q": "האם אני פטור מתשלום על חזרה על קורס סמסטריאלי? הייתי 14 ימים במילואים בסמסטר ולא הגעתי לבחינה.", "expect": "חינם רק אם נעדר משיעורים בגלל המילואים (נה\"ל 10.1.1, נספח ה' 2(ד)) ולא נבחן; ההיעדרות מהשיעורים לא נמסרה ולכן מוצגת כתנאי שטרם אומת, לא כעובדה; בלי \"לפי העובדות שמסרתם\"", "src": "pay_cases.json"}, {"id": "P03", "q": "שירתתי 9 ימי מילואים בסמסטר ולא נבחנתי בקורס הסמסטריאלי. אם אחזור עליו, אצטרך לשלם?", "expect": "מתחת לסף 10 ימים: משלמים; 'כן'", "src": "pay_cases.json"}, {"id": "N05", "q": "אני רוצה לעזוב את המעונות באמצע השנה. יש קנס?", "expect": "כתב ההרשאה תשפ\"ז, סעיף 9 (ביטול)", "src": "r2_cases.json"}, {"id": "N07", "q": "תוך כמה זמן חייבים לסיים את התואר הראשון במשפטים?", "expect": "תקנון משפטים מאי 2026 פרק ב' 2.1: שש שנים; לא לשלוף את נוסח 2024 (בארכיון, רק למקרים היסטוריים)", "src": "r2_cases.json"}, {"id": "N03", "q": "ילדתי לפני חודש. אילו התאמות מגיעות לי בבחינות ובהגשת עבודות?", "expect": "נה\"ל נספח ד' (הורות): מועד מיוחד, דחיית הגשה וכו'", "src": "r2_cases.json"}, {"id": "N09", "q": "אני \"תלמיד על תנאי\". מה קורה אם לא אמלא את התנאי בזמן?", "expect": "4.6.2 (עמוד שאינו בתוכן העניינים, תחולה לא מאומתת) + 11.4; לא להסתיר ולא להניח תוקף", "src": "r2_cases.json"}, {"id": "N02", "q": "יש לי 40% נכות מביטוח לאומי. מה מגיע לי מהאוניברסיטה?", "expect": "להפריד בין זכויות ביטוח לאומי (חיצוניות) לבין שירותים/התאמות של האוניברסיטה; שירות אינו זכות אוטומטית; נוהל ההתאמות", "src": "r2_cases.json"}, {"id": "N15", "q": "מחברת הבחינה שלי במועד ב' אבדה והמזכירות קבעה לי בחינה חוזרת בלי לשאול אותי. מה הזכויות שלי?", "expect": "7.12: הבחירה של הסטודנט (בחינה חוזרת / 'עובר' / ממוצע חלקי באישור); לא כרטיס הערעור ולא זמני פרסום ציונים", "src": "r4_cases.json"}, {"id": "E01", "q": "Synthetic QA test: Can appealing an exam grade lower my grade, and who reviews the appeal?", "expect": "The whole answer in English (the async function judge(model, c, ans) {

    '\n\nדרגו: 2 = עומדת בציפייה בעיקרה ואין בה טעות מהותית; 1 = חלקית או עם טעות לא מהותית; 0 = טעות מהותית (זכאות, מועד, גוף מוסמך או מקור שגויים, המצאה), או שלא עונה. השיבו JSON בלבד: {"score": 0|1|2, "why": "משפט אחד בעברית"}';
  for (let t = 0; t < 3; t++) {
    try {

      const j = await r.json(); const s = j.choices[0].message.content; const o = JSON.parse(s.slice(s.indexOf('{'), s.lastIndexOf('}') + 1));
      return { score: Number(o.score), why: o.why, jcost: Number(j.usage && j.usage.cost || 0) };

document.getElementById('clear').onclick = () => { R.length = 0; save(); render([]); };
document.getElementById('models').value = localStorage.getItem('bench-models') || '';
document.getElementById('go').onclick = async () => {
  const models = document.getElementById('models').value.split('\n').map(s => s.trim()).filter(Boolean);
  try { localStorage.setItem('bench-models', models.join('\n')); } catch (_) {}
  const jm = document.getElementById('judge').value.trim(); const st = document.getElementById('st'); let done = 0;
  await Promise.all(models.map(async m => {
    const f = document.createElement('iframe'); f.style.width = '1100px'; f.style.height = '900px'; document.getElementById('frames').appendChild(f);
    for (const c of CASES) {
      if (R.some(r => r.model === m && r.id === c.id)) continue;
      const r = await runOne(f, m, c);
      Object.assign(r, r.answer ? await judge(jm, c, r.answer) : { score: 0, why: 'אין תשובה: ' + r.err, jcost: 0 });
      R.push(r); save(); done++; st.textContent = done + ' מתוך ' + models.length * CASES.length; render(models);
    }
  }));
  st.textContent = 'הסתיים';
};
</script></body></html>
