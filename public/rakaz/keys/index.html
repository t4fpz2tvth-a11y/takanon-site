<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>בדיקת מקשי החצים</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;max-width:640px;margin:24px auto;padding:0 16px;line-height:1.6;color:#1d1d1b;background:#fbf9ef}
h1{font-size:1.6rem;margin:0 0 8px;color:#256035}
ol{padding-inline-start:22px;margin:0 0 12px}
#box{border:3px solid #256035;border-radius:12px;padding:18px;margin:16px 0;background:#fff;min-height:64px;font-weight:700;font-size:1.15rem;cursor:pointer}
#box.on{background:#dcebd0}
#box:focus-visible{outline:3px solid #ffd95a;outline-offset:2px}
#verdict{font-weight:700;min-height:1.6em}
#out{direction:ltr;text-align:left;width:100%;box-sizing:border-box;height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;border:2px solid #256035;border-radius:8px;padding:8px;background:#fff}
button{font:inherit;font-weight:700;padding:10px 18px;border-radius:10px;border:2px solid #256035;background:#256035;color:#fff;cursor:pointer;min-height:44px}
button:focus-visible{outline:3px solid #ffd95a;outline-offset:2px}
#done{font-weight:700;color:#256035;margin-inline-start:8px}
</style>
</head>
<body>
<h1>בדיקת מקשי החצים</h1>
<ol>
<li>לוחצים פעם אחת עם העכבר על המסגרת הירוקה.</li>
<li>מחזיקים את החץ ימינה לחוץ שתי שניות, ומשחררים.</li>
<li>לוחצים על "העתקה", ומדביקים את מה שהועתק בשיחה עם קלוד.</li>
</ol>
<div id="box" tabindex="0" role="button">לחצו כאן, ואז החזיקו את החץ ימינה שתי שניות</div>
<p id="verdict" role="status"></p>
<label for="out">תוצאת הבדיקה</label>
<textarea id="out" readonly></textarea>
<p><button id="copy" type="button">העתקה</button><span id="done" role="status"></span></p>
<script>
// דף בדיקה: מה הדפדפן שולח כשמחזיקים מקש חץ. לא נשמר ולא נשלח לשום מקום; רק מוצג כאן להעתקה.
(function(){
  var $=function(id){return document.getElementById(id)},ev=[],t0=null,pm=0,pmMoved=0,pmLast=null,types={},blurs=0,hides=0,timer=null;
  function now(){return Math.round(performance.now())}
  function rel(){if(t0===null)t0=now();return now()-t0}
  function short(k){return k==='ArrowRight'?'R':k==='ArrowLeft'?'L':k==='ArrowUp'?'U':k==='ArrowDown'?'D':k.length===1?'x':k.slice(0,3)}
  function add(kind,e){
    if(ev.length<120)ev.push({k:kind,key:short(e.key||''),t:rel(),rep:!!e.repeat,tr:e.isTrusted!==false});
    $('box').className='on';$('box').textContent='נקלט. שחררו את המקש, והתוצאה תופיע למטה.';
    clearTimeout(timer);timer=setTimeout(sum,900);
    if(/^Arrow/.test(e.key||''))e.preventDefault();
  }
  window.addEventListener('keydown',function(e){add('d',e)},true);
  window.addEventListener('keyup',function(e){add('u',e)},true);
  window.addEventListener('pointermove',function(e){if(t0===null)return;pm++;types[e.pointerType||'?']=(types[e.pointerType||'?']||0)+1;if(!pmLast||pmLast[0]!==e.clientX||pmLast[1]!==e.clientY)pmMoved++;pmLast=[e.clientX,e.clientY]},true);
  window.addEventListener('blur',function(){if(t0!==null)blurs++});
  document.addEventListener('visibilitychange',function(){if(t0!==null&&document.hidden)hides++});
  function sum(){
    var d=ev.filter(function(x){return x.k==='d'}),u=ev.filter(function(x){return x.k==='u'}),nw=d.filter(function(x){return !x.rep}).length,rp=d.length-nw,pairs=0,i;
    for(i=0;i<ev.length-1;i++)if(ev[i].k==='d'&&ev[i+1].k==='u'&&ev[i+1].t-ev[i].t<=30)pairs++;
    var span=ev.length?ev[ev.length-1].t-ev[0].t:0,v;
    if(rp>0&&u.length<=nw)v='החזקה רגילה: לחיצה אחת, '+rp+' חזרות, ושחרור בסוף.';
    else if(pairs>=3)v='כל חזרה הגיעה כלחיצה ושחרור נפרדים ('+pairs+' זוגות). זה מה שגורם לתנועה מקוטעת.';
    else if(nw===1&&rp===0)v='הגיעה לחיצה אחת בלי חזרות, שנמשכה '+span+' אלפיות שנייה.';
    else v='דפוס אחר: '+nw+' לחיצות, '+rp+' חזרות, '+u.length+' שחרורים.';
    $('verdict').textContent=v;
    $('out').value='KEYS1 | '+navigator.userAgent+' | touch='+(navigator.maxTouchPoints||0)+' | new='+nw+' rep='+rp+' up='+u.length+' pairs='+pairs+' span='+span+' | pm='+pm+'/'+pmMoved+' '+JSON.stringify(types)+' blur='+blurs+' hide='+hides+' | '+ev.map(function(x){return x.k+(x.rep?'r':'')+x.key+x.t+(x.tr?'':'!')}).join(' ');
    $('box').className='';$('box').textContent='אפשר לבדוק שוב: רענון הדף מתחיל מחדש.';
  }
  $('copy').addEventListener('click',function(){
    var o=$('out');if(!o.value){$('done').textContent='עוד אין תוצאה. קודם מחזיקים את החץ ומשחררים.';return}
    function ok(){$('done').textContent='הועתק. אפשר להדביק בשיחה.'}
    function old(){o.focus();o.select();try{document.execCommand('copy');ok()}catch(e){$('done').textContent='סמנו את הטקסט והעתיקו ידנית.'}}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(o.value).then(ok,old);else old();
  });
})();
</script>
</body>
</html>
