 ערעור על ציון העבודה יידחה את מועד סיום התואר, עלול לעכב את הענקת התעודה בשנה ועלול לפגוע בזכאות התלמיד למלגות ופרסים.\nג. לאחר הגשת הערעור, תימסר העבודה להערכה עצמאית על ידי קורא נוסף.\nד. תחליט כל פקולטה כיצד ישוכלל ציון הקורא הנוסף עם ציוני המנחה/ים והקורא/ים הקודם/מים ובלבד שמשקל ציוני המנחים לא יעלה על 50% מציון העבודה.\n\nתקנון הפקולטה למשפטים, פרק ח' סעיף 6 (ערעור על ציון בבחינה (ראו גם סעיף…):\n6. ערעור על ציון בבחינה (ראו גם סעיף 7.10)לנהלי האוניברסיטה\n6.1 ניתן לערער על ציון בחינה.\n6.2 תלמיד/ה שלקח/ה את מחברת הבחינה לא יורשה לערער.\n6.3 הערעור יוגש בעילום שם על טופס מיוחד באתר האינטרנט של הפקולטה ב תוך 48 שעות מן המועד שבו המחברות זמינות או ממועד,מפרסום פתרון הבחינה לפי המאוחר. נימוקי הערעור יתייחסו אך ורק לפגמים 23 בקורסי \"אבני פינה\" של הפקולטה למשפטים, המוצעים לתלמידי/ות משפטים ותלמידי/ות יחידות אקדמיות אחרות בצוותא (קורס.ים \"לא ייעודיים\"), יחולו כללי התאמת הציונים בסעיף זה גם על מי שאינם מהפקולטה למשפטים בקורסי \"אבני פינה\" המוצעים על ידי הפקולטה למשפטים רק למי שאינם תלמידות/יה (קורסים \"ייעודיים\") לא יחולו כללים אלה. בולטים שנפלו ב בדיקת הבחינה, כגון טעות בחישוב הציון או התעלמות מתוכן התשובה. יש להימנע מנימוקים שאינם שייכים לעניין, כגון, שאי קבלת הערעור תגרום קשיים מיוחדים למערער, או שנסיבות אישיות מנע ו מהמערער להתכונן כראוי לבחינה. הציון המתוקן, או החלטתו המנומקת של המורה לדחות את הערעור, יימסרו בתוך 2 ימי עבודה החל מהיום שלאחר המועד האחרון להגשת הערעורים, אלא אם ניתנה ארכה של עד יום נוסף על ידי סגן הדיקן.\n6.4 הערעור יידחה על הסף כאשר צוין שם המערער/ת על גבי הטופס או מחברת הבחינה או הובהרה זהות המערער/ת בדרך אחרת. הערעור יידחה על הסף אם הוא מתבסס על נימוקים שאינם נוגעים לפגמים שנפלו בבדיקה.\n6.5 עד למתן החלטה בערעור יישאר בתוקפו הציון שעליו הוגש ה ערע ו.ר\n6.6 הערעור ייבדק על- ידי המורה בקורס. ל מורה יש שיקול דעת מלא להעלות או להוריד את ציון הבחינה ללא, הגבלה לטיעונים שהועלו בנימוקי הערעור או לתשובות לשאלות אליהן התייחס הערעור. חובה לנמק את ההחלט ה בערעור.\n6.7 על אף האמור בסעיף 6.6 לעיל, בבחינה שנבדקה בידי בודק/ת או מתרגל/ת ושבה בוצעה התאמת ציונים לפי סעיף 2 בחלק זה ש ל ה תקנון:\n6.7.1 תיקון ציון בשל פגמים שלא צוינו בנימוקי הערעור יהיה רק לאחר בדיקה מחודשת של כלל הבחינות בקורס אם פגמים אלו עשויות לגעת בהן.,\n6.7.2 הומלץ על תיקון ציון כללי כאמור בסעיף קטן זה, תועבר ההמלצה.המנומקת לאישור סגן הדיקן", "ref": "48 שעות לפי תקנון משפטים פרק ח׳ סעיף 6 (המועד הקצר, בשורה הראשונה), בטופס באתר הפקולטה, בעילום שם; לציין גם 3 ימי עבודה בנה\"ל."}, {"id": "q3", "q": "אני רוצה לערער על ציון של עבודה סמינריונית. עד מתי?", "ctx": "נהלי הוראה ולימודים, סעיף 7.11 (ערעורים על ציוני בחינות):\n7.11.1 תלמידים רשאים לערער על ציוני בחינה.\n7.11.2 תלמידים השוקלים הגשת ערעור חייבים לראות את מחברת/טופס הבחינה לאחר מתן ציונים וכן לקבל מהמורה הסבר (הערות בגוף הבחינה דינן כדין הסבר).\n7.11.2.1 מעמדו של עותק סרוק של בחינה המוצג לתלמיד באמצעות אתר מודל זהה לעניין זה למחברת הבחינה.\n7.11.3 ערעור יוגש בכתב 3 ימי עבודה ממועד פרסום מחברות הבחינה, תוך פירוט הנימוקים להגשת הערעור. הערעור יוגש למורה ללא ציון שמו של התלמיד המערער, לפי הנהלים של כל פקולטה. 7.11.4 בבירור הערעור, רשאי המורה לבדוק מחדש את כל הבחינה. הציון שייקבע לאחר הבדיקה החוזרת, בין אם הוא נמוך או גבוה מהקודם, יהיה ציון הבחינה.\n7.11.5 הציון המתוקן, או החלטתו המנומקת של המורה לדחות את הערעור, יימסרו בתוך 3 ימי עבודה החל מהיום שלאחר המועד האחרון להגשת הערעורים.\n7.11.6 הפקולטה (ביה\"ס) רשאית להאריך את התקופות האמורות להגשת ערעור ולמתן תשובה על ערעור, ובלבד שהתשובה על הערעור תינתן לכל המאוחר 48 שעות לפני המועד הבא של המבחן ובתנאי שלא ייפגעו זכויות התלמידים.\n7.11.7 תשובתו של המורה היא סופית, למעט בנסיבות המתוארות בסעיף .19.1.4\n\nנהלי הוראה ולימודים, סעיף 19.1 (סטודנט רשאי לערער על ציון בבחינה, במטלה אקדמית או בקורס):\n(ראה גם סעיפים 7.10 ו)8.5 - 19.1.1 הערעור יוגש למורה או לסמכות האקדמית אשר העניקה את הציון, ללא ציון שמו של התלמיד המערער.\n19.1.2 תלמיד רשאי לעיין בבחינה, בעבודה וכו' לפני הגשת הערעור.\n19.1.3 הערעור ינומק ויוגש תוך 3 ימי עסקים מיום פרסום מחברת הבחינה 19.1.4.תשובת המורה על הערעור הנה סופית למעט במקרים של חריגה מנהלי האוניברסיטה (פניה על פי סעיף\n19.2 להלן) וטענות על אפליה, התנכלות או שיקולים פסולים או זרים במתן הציון (פניה על פי סעיף 19.4 להלן). עם זאת, ניתן להגיש ערעור לראש החוג בנוגע לתכנים לימודיים, ובתנאי שהוצגו נתונים, מקורות מהספרות, חומר לימוד וכו' התומכים בטענה על טעות שארעה בבדיקת שאלה בבחינה. ראש החוג יוכל להשיב בעצמו על הערעור או להיעזר בבר-סמכא נוסף.\n\nנהלי הוראה ולימודים, סעיף 8.3 (בדיקת מטלות בכתב ומועד החזרתן):\n8.3.1 בחינות בית, תרגילים, דו\"חות ועבודות ביניים יוחזרו לתלמידים תוך שבועיים מהמועד האחרון שקבע המורה להגשתם או שבועיים לאחר שהוגשו, המאוחר ביניהם.\n8.3.2 עבודות סיום קורס – המורה ימסור את ציון העבודה ויחזיר את העבודה בתוך חודש מהמועד האחרון שנקבע להגשת העבודות בקורס או חודש לאחר שהוגשו, המאוחר ביניהם. דין ערעור על ציון בעבודה, כדין ערעור על ציון בבחינה (ראו פרק. )7\n8.3.3 תלמיד אינו רשאי להגיש תיקון לעבודה, בחינת בית, תרגילים או כל עבודה אחרת בכתב לאחר שהמורה דיווח על הציון בגין העבודה, התרגיל או הבחינה.\n8.3.4 עבודת גמר למוסמך, עבודות סמינריוניות, עבודות פרוסמינריוניות – המורה ימסור את ציון העבודה ויחזיר את העבודה בתוך חודשיים מהמועד שנקבע להגשת העבודה או חודשיים לאחר שהוגשה, המאוחר ביניהם.\n8.3.5 עבודת גמר למוסמך:\nא. העבודה תימסר להערכת קורא/ים הבקיא/ים בנושא העבודה. המנחה/ים והקורא/ים ימסרו את הציון ואת הערכתם המפורטת על העבודה לא יאוחר מחודשיים לאחר מועד הגשת העבודה.\nב. הערכת העבודה והענקת הציון על ידי המנחה/ים והקורא/ים תיעשה באופן עצמאי.\nג. זהותם של הקוראים תהיה חסויה בפני התלמיד, אלא אם ויתר הקורא על חסיון זה.\nד. חלקו/ם של המנחה/ים לא יעלה על 50% מהציון על העבודה הכתובה.\nה. תקבע כל פקולטה כיצד יחושב הציון כאשר הפער בציונים שקבעו המנחים והקוראים עולה על .10%\nו. תקבע כל פקולטה מהו חלקו היחסי של ציון העבודה מהציון הכולל של התלמיד בתואר.\nז. עותק אלקטרוני של עבודות מוסמך ראויות יופקד בספריית האוניברסיטה וזאת עלפי קריטריונים שתקבע הפקולטה.\n8.3.5 תלמידים שלא קיבלו ציון במועד רשאים לפנות למזכירות הפקולטה שתטפל בבעיה באופן שיבטיח את אלמוניותם.\n8.3.6 במקרה שעבודה נבדקת על ידי יותר מאדם אחד, כל בודק יבדוק את העבודה וייתן ציון באופן עצמאי.\n\nנהלי הוראה ולימודים, סעיף 8.5 (ערעור על ציון בעבודה גמר למוסמך):\n8.5.1 ערעור על ציון עבודת גמר למוסמך\nא. ניתן לערער על ציון העבודה ובלבד שהערעור מנומק ומוגש בתוך 3 ימי עסקים ממועד פרסום הציון (על פי נהלי הערעור --סעיף. )7.10.3\nב. ערעור על ציון העבודה יידחה את מועד סיום התואר, עלול לעכב את הענקת התעודה בשנה ועלול לפגוע בזכאות התלמיד למלגות ופרסים.\nג. לאחר הגשת הערעור, תימסר העבודה להערכה עצמאית על ידי קורא נוסף.\nד. תחליט כל פקולטה כיצד ישוכלל ציון הקורא הנוסף עם ציוני המנחה/ים והקורא/ים הקודם/מים ובלבד שמשקל ציוני המנחים לא יעלה על 50% מציון העבודה.", "ref": "הזכות קיימת (19.1); 8.3.2 משווה עבודה לבחינה אבל לא קובע ממתי סופרים; אסור לחשב תאריך או לתת 48/72 שעות; לפנות מיד למורה/מזכירות."}, {"id": "q4", "q": "אני רוצה לערער על הציון שלי. עד מתי?", "ctx": "נהלי הוראה ולימודים, סעיף 7.11 (ערעורים על ציוני בחינות):\n7.11.1 תלמידים רשאים לערער על ציוני בחינה.\n7.11.2 תלמידים השוקלים הגשת ערעור חייבים לראות את מחברת/טופס הבחינה לאחר מתן ציונים וכן לקבל מהמורה הסבר (הערות בגוף הבחינה דינן כדין הסבר).\n7.11.2.1 מעמדו של עותק סרוק של בחינה המוצג לתלמיד באמצעות אתר מודל זהה לעניין זה למחברת הבחינה.\n7.11.3 ערעור יוגש בכתב 3 ימי עבודה ממועד פרסום מחברות הבחינה, תוך פירוט הנימוקים להגשת הערעור. הערעור יוגש למורה ללא ציון שמו של התלמיד המערער, לפי הנהלים של כל פקולטה. 7.11.4 בבירור הערעור, רשאי המורה לבדוק מחדש את כל הבחינה. הציון שייקבע לאחר הבדיקה החוזרת, בין אם הוא נמוך או גבוה מהקודם, יהיה ציון הבחינה.\n7.11.5 הציון המתוקן, או החלטתו המנומקת של המורה לדחות את הערעור, יימסרו בתוך 3 ימי עבודה החל מהיום שלאחר המועד האחרון להגשת הערעורים.\n7.11.6 הפקולטה (ביה\"ס) רשאית להאריך את התקופות האמורות להגשת ערעור ולמתן תשובה על ערעור, ובלבד שהתשובה על הערעור תינתן לכל המאוחר 48 שעות לפני המועד הבא של המבחן ובתנאי שלא ייפגעו זכויות התלמידים.\n7.11.7 תשובתו של המורה היא סופית, למעט בנסיבות המתוארות בסעיף .19.1.4\n\nנהלי הוראה ולימודים, סעיף 19.1 (סטודנט רשאי לערער על ציון בבחינה, במטלה אקדמית או בקורס):\n(ראה גם סעיפים 7.10 ו)8.5 - 19.1.1 הערעור יוגש למורה או לסמכות האקדמית אשר העניקה את הציון, ללא ציון שמו של התלמיד המערער.\n19.1.2 תלמיד רשאי לעיין בבחינה, בעבודה וכו' לפני הגשת הערעור.\n19.1.3 הערעור ינומק ויוגש תוך 3 ימי עסקים מיום פרסום מחברת הבחינה 19.1.4.תשובת המורה על הערעור הנה סופית למעט במקרים של חריגה מנהלי האוניברסיטה (פניה על פי סעיף\n19.2 להלן) וטענות על אפליה, התנכלות או שיקולים פסולים או זרים במתן הציון (פניה על פי סעיף 19.4 להלן). עם זאת, ניתן להגיש ערעור לראש החוג בנוגע לתכנים לימודיים, ובתנאי שהוצגו נתונים, מקורות מהספרות, חומר לימוד וכו' התומכים בטענה על טעות שארעה בבדיקת שאלה בבחינה. ראש החוג יוכל להשיב בעצמו על הערעור או להיעזר בבר-סמכא נוסף.\n\nנהלי הוראה ולימודים, סעיף 8.3 (בדיקת מטלות בכתב ומועד החזרתן):\n8.3.1 בחינות בית, תרגילים, דו\"חות ועבודות ביניים יוחזרו לתלמידים תוך שבועיים מהמועד האחרון שקבע המורה להגשתם או שבועיים לאחר שהוגשו, המאוחר ביניהם.\n8.3.2 עבודות סיום קורס – המורה ימסור את ציון העבודה ויחזיר את העבודה בתוך חודש מהמועד האחרון שנקבע להגשת העבודות בקורס או חודש לאחר שהוגשו, המאוחר ביניהם. דין ערעור על ציון בעבודה, כדין ערעור על ציון בבחינה (ראו פרק. )7\n8.3.3 תלמיד אינו רשאי להגיש תיקון לעבודה, בחינת בית, תרגילים או כל עבודה אחרת בכתב לאחר שהמורה דיווח על הציון בגין העבודה, התרגיל או הבחינה.\n8.3.4 עבודת גמר למוסמך, עבודות סמינריוניות, עבודות פרוסמינריוניות – המורה ימסור את ציון העבודה ויחזיר את העבודה בתוך חודשיים מהמועד שנקבע להגשת העבודה או חודשיים לאחר שהוגשה, המאוחר ביניהם.\n8.3.5 עבודת גמר למוסמך:\nא. העבודה תימסר להערכת קורא/ים הבקיא/ים בנושא העבודה. המנחה/ים והקורא/ים ימסרו את הציון ואת הערכתם המפורטת על העבודה לא יאוחר מחודשיים לאחר מועד הגשת העבודה.\nב. הערכת העבודה והענקת הציון על ידי המנחה/ים והקורא/ים תיעשה באופן עצמאי.\nג. זהותם של הקוראים תהיה חסויה בפני התלמיד, אלא אם ויתר הקורא על חסיון זה.\nד. חלקו/ם של המנחה/ים לא יעלה על 50% מהציון על העבודה הכתובה.\nה. תקבע כל פקולטה כיצד יחושב הציון כאשר הפער בציונים שקבעו המנחים והקוראים עולה על .10%\nו. תקבע כל פקולטה מהו חלקו היחסי של ציון העבודה מהציון הכולל של התלמיד בתואר.\nז. עותק אלקטרוני של עבודות מוסמך ראויות יופקד בספריית האוניברסיטה וזאת עלפי קריטריונים שתקבע הפקולטה.\n8.3.5 תלמידים שלא קיבלו ציון במועד רשאים לפנות למזכירות הפקולטה שתטפל בבעיה באופן שיבטיח את אלמוניותם.\n8.3.6 במקרה שעבודה נבדקת על ידי יותר מאדם אחד, כל בודק יבדוק את העבודה וייתן ציון באופן עצמאי.\n\nנהלי הוראה ולימודים, סעיף 8.5 (ערעור על ציון בעבודה גמר למוסמך):\n8.5.1 ערעור על ציון עבודת גמר למוסמך\nא. ניתן לערער על ציון העבודה ובלבד שהערעור מנומק ומוגש בתוך 3 ימי עסקים ממועד פרסום הציון (על פי נהלי הערעור --סעיף. )7.10.3\nב. ערעור על ציון העבודה יידחה את מועד סיום התואר, עלול לעכב את הענקת התעודה בשנה ועלול לפגוע בזכאות התלמיד למלגות ופרסים.\nג. לאחר הגשת הערעור, תימסר העבודה להערכה עצמאית על ידי קורא נוסף.\nד. תחליט כל פקולטה כיצד ישוכלל ציון הקורא הנוסף עם ציוני המנחה/ים והקורא/ים הקודם/מים ובלבד שמשקל ציוני המנחים לא יעלה על 50% מציון העבודה.", "ref": "תלוי בסוג: בחינה 3 ימי עבודה; עבודת קורס לפי 8.3.2 בלי נקודת התחלה ברורה; עבודת גמר למוסמך 3 ימי עסקים מפרסום הציון (8.5.1); לשאול מה הסוג."}, {"id": "q5", "q": "הייתי חולה במועד א ולא ניגשתי. מגיע לי מועד מיוחד?", "ctx": "נהלי הוראה ולימודים, סעיף 7.4 (מועד בחינה מיוחד):\n7.4.1 המועדים המיוחדים מיועדים לתלמידים שנבצר מהם לגשת למועד הרגיל (לרבות מבחן בית שיש להגישו בתקופה הנכללת במסגרת האירוע המזכה) או למועד הנוסף של הבחינה בשל הנסיבות א'-ו' או שנפגעו על פי סעיף ז' להלן 7.4.2: נסיבות המזכות במועד מיוחד:\n(א) שירות מילואים פעיל -ביום הבחינה; שירות במילואים במשך 10 ימים לפחות במצטבר במהלך תקופת הבחינות; או שירות מילואים במשך יותר מ-9 ימים רצופים או יותר מ-20 ימים במצטבר במהלך הסמסטר בו היה התלמיד רשום לקורס, ובתנאי שהומצאו על כך אישורים מתאימים. סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n1. שירות מילואים רצוף של 2-3 ימים, רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך 24 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקורס, הציון האחרון הוא הקובע. בכפוף לנוהלי הפקולטה, תלמיד שנרשם למועד נוסף (מועד ב') ולא ביטל הרשמתו לבחינה עד 3 ימי עבודה לפני הבחינה, יוטל עליו תשלום דמי טיפול מיוחד בסך 200 ש\"ח.\nחשוב לדעת: -הפקולטה, החוג או מורה הקורס רשאים שלא לאפשר לתלמיד להיבחן במועד הנוסף אם לא נרשם לבחינה על פי נהלי אותה פקולטה. -תלמיד שבחר שלא להיבחן במועד הרגיל ותכנן או ניגש רק למועד הנוסף, יעשה זאת על אחריותו. התלמיד לא יהיה זכאי להיבחן במועד מיוחד למעט מצב בו לא ניגש למבחן במועד הנוסף בשל נסיבות מיוחדות המתוארות בסעיף 7.4.2. אם מדובר בקורס חובה, יהיה עליו לרשום אותו בשנית בשנה בה יוצע הקורס שוב. -אין מחויבות או גם יכולת להבטיח מרווח כזה או אחר בין הבחינות בקורסי בחירה או חובת בחירה, ותיתכן אף חפיפה בלוח הבחינות האישי. המועד הנוסף נועד לספק פתרון לבעיה\nזו. לכן, אין לפנות בבקשה למועד מיוחד בנימוק של צפיפות בלוח הבחינות האישי, למעט על פי סעיף 7.4.1 ו'.\n7.2.8 לוח הבחינות ייקבע מראש ויפורסם לידיעת התלמידים לקראת תקופת הרישום לקורסים.\n7.2.8.1 לוח בחינות אישי – לוח הבחינות האישי של התלמיד יוצג ב\"אתר מידע אישי\" באינטרנט.\n7.2.8.2 מועד בחינה בקורס – יוצג כחלק מפרטי הקורס במסגרת השנתון האוניברסיטאי באתר האינטרנט.\n7.2.8.3 לאחר פרסום לוח המבחנים ועם תום השבוע הראשון בתקופת השינויים של סמסטר א' לא ניתן יהיה לערוך בו שינויים בקורסים שנתיים ובקורסים הנלמדים בסמסטר א'. בקורסים המתחילים בסמסטר ב' יתאפשר שינוי בלוח המבחנים עד לתום השבוע הראשון של תקופת השינויים של סמסטר ב'\n\nנהלי הוראה ולימודים, סעיף נספח ה' סעיף 5 (בחינה):\n5. בחינה\n(א) סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד מיוחד בעבור כל מועד שהפסיד (ראו סעיף ד להלן).\n(ב) סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n• שירות מילואים רצוף של 2-3 ימים: רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך\n24 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 4-6 ימים: רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 7-9 ימים: רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n(ג) סטודנט ששירת שירות מילואים כמפורט להלן, יהיה זכאי להיבחן במועד מיוחד בכל קורס שהיה אמור להיבחן בו בתקופת הבחינות, בהתאם לאמור בסעיף ד' להלן:\n1. שירת 10 ימים לפחות במצטבר במהלך תקופת הבחינות.\n2. במהלך הסמסטר הסמוך לתקופת הבחינות שירת שירות מילואים של 10 ימי מילואים רצופים לפחות או 21 ימים במצטבר.\n3. שירת שירות מילואים בנסיבות חריגות של 5 ימים רצופים לפחות, במהלך תקופת הבחינות או בסמסטר הסמוך לה, או 21 ימים במצטבר במהלך הסמסטר הסמוך לתקופת הבחינות.\n(ד) מועד בחינה מיוחד לפי סעיף זה יתקיים בתוך 45 ימים ממועד הבחינה האחרון בקורס; או במהלך הסמסטר העוקב למועד קיום הבחינה; או במועד אחר שתציע הפקולטה, בהסכמת הסטודנט, שיתקיים לכל המאוחר בשנת הלימודים העוקבת למועד קיום הבחינה; והכול לפי בחירת הסטודנט.\n***יש לפנות לרכז המילואים של פקולטת או לוועדת ההוראה הרלוונטית בבקשות למועד מיוחד***", "ref": "לא זכות אוטומטית: שיקול דעת של ועדת ההוראה (7.4.2(ט)), בדרך כלל בתנאי שניגש למועד האחר; לשאול אם ניגש למועד ב; עם אישורים, לוועדת ההוראה, עד שבוע אחרי ציוני מועד ב (7.4.4)."}, {"id": "q6", "q": "אושפזתי בבית חולים במועד א. מגיע לי מועד מיוחד?", "ctx": "נהלי הוראה ולימודים, סעיף 7.4 (מועד בחינה מיוחד):\n7.4.1 המועדים המיוחדים מיועדים לתלמידים שנבצר מהם לגשת למועד הרגיל (לרבות מבחן בית שיש להגישו בתקופה הנכללת במסגרת האירוע המזכה) או למועד הנוסף של הבחינה בשל הנסיבות א'-ו' או שנפגעו על פי סעיף ז' להלן 7.4.2: נסיבות המזכות במועד מיוחד:\n(א) שירות מילואים פעיל -ביום הבחינה; שירות במילואים במשך 10 ימים לפחות במצטבר במהלך תקופת הבחינות; או שירות מילואים במשך יותר מ-9 ימים רצופים או יותר מ-20 ימים במצטבר במהלך הסמסטר בו היה התלמיד רשום לקורס, ובתנאי שהומצאו על כך אישורים מתאימים. סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n1. שירות מילואים רצוף של 2-3 ימים, רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך 24 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקורס, הציון האחרון הוא הקובע. בכפוף לנוהלי הפקולטה, תלמיד שנרשם למועד נוסף (מועד ב') ולא ביטל הרשמתו לבחינה עד 3 ימי עבודה לפני הבחינה, יוטל עליו תשלום דמי טיפול מיוחד בסך 200 ש\"ח.\nחשוב לדעת: -הפקולטה, החוג או מורה הקורס רשאים שלא לאפשר לתלמיד להיבחן במועד הנוסף אם לא נרשם לבחינה על פי נהלי אותה פקולטה. -תלמיד שבחר שלא להיבחן במועד הרגיל ותכנן או ניגש רק למועד הנוסף, יעשה זאת על אחריותו. התלמיד לא יהיה זכאי להיבחן במועד מיוחד למעט מצב בו לא ניגש למבחן במועד הנוסף בשל נסיבות מיוחדות המתוארות בסעיף 7.4.2. אם מדובר בקורס חובה, יהיה עליו לרשום אותו בשנית בשנה בה יוצע הקורס שוב. -אין מחויבות או גם יכולת להבטיח מרווח כזה או אחר בין הבחינות בקורסי בחירה או חובת בחירה, ותיתכן אף חפיפה בלוח הבחינות האישי. המועד הנוסף נועד לספק פתרון לבעיה\nזו. לכן, אין לפנות בבקשה למועד מיוחד בנימוק של צפיפות בלוח הבחינות האישי, למעט על פי סעיף 7.4.1 ו'.\n7.2.8 לוח הבחינות ייקבע מראש ויפורסם לידיעת התלמידים לקראת תקופת הרישום לקורסים.\n7.2.8.1 לוח בחינות אישי – לוח הבחינות האישי של התלמיד יוצג ב\"אתר מידע אישי\" באינטרנט.\n7.2.8.2 מועד בחינה בקורס – יוצג כחלק מפרטי הקורס במסגרת השנתון האוניברסיטאי באתר האינטרנט.\n7.2.8.3 לאחר פרסום לוח המבחנים ועם תום השבוע הראשון בתקופת השינויים של סמסטר א' לא ניתן יהיה לערוך בו שינויים בקורסים שנתיים ובקורסים הנלמדים בסמסטר א'. בקורסים המתחילים בסמסטר ב' יתאפשר שינוי בלוח המבחנים עד לתום השבוע הראשון של תקופת השינויים של סמסטר ב'\n\nנהלי הוראה ולימודים, סעיף נספח ה' סעיף 5 (בחינה):\n5. בחינה\n(א) סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד מיוחד בעבור כל מועד שהפסיד (ראו סעיף ד להלן).\n(ב) סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n• שירות מילואים רצוף של 2-3 ימים: רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך\n24 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 4-6 ימים: רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 7-9 ימים: רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n(ג) סטודנט ששירת שירות מילואים כמפורט להלן, יהיה זכאי להיבחן במועד מיוחד בכל קורס שהיה אמור להיבחן בו בתקופת הבחינות, בהתאם לאמור בסעיף ד' להלן:\n1. שירת 10 ימים לפחות במצטבר במהלך תקופת הבחינות.\n2. במהלך הסמסטר הסמוך לתקופת הבחינות שירת שירות מילואים של 10 ימי מילואים רצופים לפחות או 21 ימים במצטבר.\n3. שירת שירות מילואים בנסיבות חריגות של 5 ימים רצופים לפחות, במהלך תקופת הבחינות או בסמסטר הסמוך לה, או 21 ימים במצטבר במהלך הסמסטר הסמוך לתקופת הבחינות.\n(ד) מועד בחינה מיוחד לפי סעיף זה יתקיים בתוך 45 ימים ממועד הבחינה האחרון בקורס; או במהלך הסמסטר העוקב למועד קיום הבחינה; או במועד אחר שתציע הפקולטה, בהסכמת הסטודנט, שיתקיים לכל המאוחר בשנת הלימודים העוקבת למועד קיום הבחינה; והכול לפי בחירת הסטודנט.\n***יש לפנות לרכז המילואים של פקולטת או לוועדת ההוראה הרלוונטית בבקשות למועד מיוחד***", "ref": "כן, זכות לפי 7.4.2 (אשפוז), בכפוף לאישורים, גם בלי מועד א; בקשה לוועדת ההוראה עם מסמכים מקוריים (7.4.4)."}, {"id": "q7", "q": "שירתתי 25 ימי מילואים בתקופת הבחינות. מגיע לי מועד מיוחד?", "ctx": "נהלי הוראה ולימודים, סעיף 7.4 (מועד בחינה מיוחד):\n7.4.1 המועדים המיוחדים מיועדים לתלמידים שנבצר מהם לגשת למועד הרגיל (לרבות מבחן בית שיש להגישו בתקופה הנכללת במסגרת האירוע המזכה) או למועד הנוסף של הבחינה בשל הנסיבות א'-ו' או שנפגעו על פי סעיף ז' להלן 7.4.2: נסיבות המזכות במועד מיוחד:\n(א) שירות מילואים פעיל -ביום הבחינה; שירות במילואים במשך 10 ימים לפחות במצטבר במהלך תקופת הבחינות; או שירות מילואים במשך יותר מ-9 ימים רצופים או יותר מ-20 ימים במצטבר במהלך הסמסטר בו היה התלמיד רשום לקורס, ובתנאי שהומצאו על כך אישורים מתאימים. סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n1. שירות מילואים רצוף של 2-3 ימים, רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך 24 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקורס, הציון האחרון הוא הקובע. בכפוף לנוהלי הפקולטה, תלמיד שנרשם למועד נוסף (מועד ב') ולא ביטל הרשמתו לבחינה עד 3 ימי עבודה לפני הבחינה, יוטל עליו תשלום דמי טיפול מיוחד בסך 200 ש\"ח.\nחשוב לדעת: -הפקולטה, החוג או מורה הקורס רשאים שלא לאפשר לתלמיד להיבחן במועד הנוסף אם לא נרשם לבחינה על פי נהלי אותה פקולטה. -תלמיד שבחר שלא להיבחן במועד הרגיל ותכנן או ניגש רק למועד הנוסף, יעשה זאת על אחריותו. התלמיד לא יהיה זכאי להיבחן במועד מיוחד למעט מצב בו לא ניגש למבחן במועד הנוסף בשל נסיבות מיוחדות המתוארות בסעיף 7.4.2. אם מדובר בקורס חובה, יהיה עליו לרשום אותו בשנית בשנה בה יוצע הקורס שוב. -אין מחויבות או גם יכולת להבטיח מרווח כזה או אחר בין הבחינות בקורסי בחירה או חובת בחירה, ותיתכן אף חפיפה בלוח הבחינות האישי. המועד הנוסף נועד לספק פתרון לבעיה\nזו. לכן, אין לפנות בבקשה למועד מיוחד בנימוק של צפיפות בלוח הבחינות האישי, למעט על פי סעיף 7.4.1 ו'.\n7.2.8 לוח הבחינות ייקבע מראש ויפורסם לידיעת התלמידים לקראת תקופת הרישום לקורסים.\n7.2.8.1 לוח בחינות אישי – לוח הבחינות האישי של התלמיד יוצג ב\"אתר מידע אישי\" באינטרנט.\n7.2.8.2 מועד בחינה בקורס – יוצג כחלק מפרטי הקורס במסגרת השנתון האוניברסיטאי באתר האינטרנט.\n7.2.8.3 לאחר פרסום לוח המבחנים ועם תום השבוע הראשון בתקופת השינויים של סמסטר א' לא ניתן יהיה לערוך בו שינויים בקורסים שנתיים ובקורסים הנלמדים בסמסטר א'. בקורסים המתחילים בסמסטר ב' יתאפשר שינוי בלוח המבחנים עד לתום השבוע הראשון של תקופת השינויים של סמסטר ב'\n\nנהלי הוראה ולימודים, סעיף נספח ה' סעיף 5 (בחינה):\n5. בחינה\n(א) סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד מיוחד בעבור כל מועד שהפסיד (ראו סעיף ד להלן).\n(ב) סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n• שירות מילואים רצוף של 2-3 ימים: רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך\n24 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 4-6 ימים: רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 7-9 ימים: רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n(ג) סטודנט ששירת שירות מילואים כמפורט להלן, יהיה זכאי להיבחן במועד מיוחד בכל קורס שהיה אמור להיבחן בו בתקופת הבחינות, בהתאם לאמור בסעיף ד' להלן:\n1. שירת 10 ימים לפחות במצטבר במהלך תקופת הבחינות.\n2. במהלך הסמסטר הסמוך לתקופת הבחינות שירת שירות מילואים של 10 ימי מילואים רצופים לפחות או 21 ימים במצטבר.\n3. שירת שירות מילואים בנסיבות חריגות של 5 ימים רצופים לפחות, במהלך תקופת הבחינות או בסמסטר הסמוך לה, או 21 ימים במצטבר במהלך הסמסטר הסמוך לתקופת הבחינות.\n(ד) מועד בחינה מיוחד לפי סעיף זה יתקיים בתוך 45 ימים ממועד הבחינה האחרון בקורס; או במהלך הסמסטר העוקב למועד קיום הבחינה; או במועד אחר שתציע הפקולטה, בהסכמת הסטודנט, שיתקיים לכל המאוחר בשנת הלימודים העוקבת למועד קיום הבחינה; והכול לפי בחירת הסטודנט.\n***יש לפנות לרכז המילואים של פקולטת או לוועדת ההוראה הרלוונטית בבקשות למועד מיוחד***", "ref": "כן: נספח ה׳ 5 — זכאי למועד מיוחד על כל מועד שהפסיד, בלי תנאי נוכחות; לפנות לרכז/ת המילואים או לוועדת ההוראה."}, {"id": "q8", "q": "לא ניגשתי למועד א כי העדפתי ללמוד יותר, ובמועד ב הייתי חולה. מגיע לי מועד מיוחד?", "ctx": "נהלי הוראה ולימודים, סעיף 7.4 (מועד בחינה מיוחד):\n7.4.1 המועדים המיוחדים מיועדים לתלמידים שנבצר מהם לגשת למועד הרגיל (לרבות מבחן בית שיש להגישו בתקופה הנכללת במסגרת האירוע המזכה) או למועד הנוסף של הבחינה בשל הנסיבות א'-ו' או שנפגעו על פי סעיף ז' להלן 7.4.2: נסיבות המזכות במועד מיוחד:\n(א) שירות מילואים פעיל -ביום הבחינה; שירות במילואים במשך 10 ימים לפחות במצטבר במהלך תקופת הבחינות; או שירות מילואים במשך יותר מ-9 ימים רצופים או יותר מ-20 ימים במצטבר במהלך הסמסטר בו היה התלמיד רשום לקורס, ובתנאי שהומצאו על כך אישורים מתאימים. סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n1. שירות מילואים רצוף של 2-3 ימים, רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך 24 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקורס, הציון האחרון הוא הקובע. בכפוף לנוהלי הפקולטה, תלמיד שנרשם למועד נוסף (מועד ב') ולא ביטל הרשמתו לבחינה עד 3 ימי עבודה לפני הבחינה, יוטל עליו תשלום דמי טיפול מיוחד בסך 200 ש\"ח.\nחשוב לדעת: -הפקולטה, החוג או מורה הקורס רשאים שלא לאפשר לתלמיד להיבחן במועד הנוסף אם לא נרשם לבחינה על פי נהלי אותה פקולטה. -תלמיד שבחר שלא להיבחן במועד הרגיל ותכנן או ניגש רק למועד הנוסף, יעשה זאת על אחריותו. התלמיד לא יהיה זכאי להיבחן במועד מיוחד למעט מצב בו לא ניגש למבחן במועד הנוסף בשל נסיבות מיוחדות המתוארות בסעיף 7.4.2. אם מדובר בקורס חובה, יהיה עליו לרשום אותו בשנית בשנה בה יוצע הקורס שוב. -אין מחויבות או גם יכולת להבטיח מרווח כזה או אחר בין הבחינות בקורסי בחירה או חובת בחירה, ותיתכן אף חפיפה בלוח הבחינות האישי. המועד הנוסף נועד לספק פתרון לבעיה\nזו. לכן, אין לפנות בבקשה למועד מיוחד בנימוק של צפיפות בלוח הבחינות האישי, למעט על פי סעיף 7.4.1 ו'.\n7.2.8 לוח הבחינות ייקבע מראש ויפורסם לידיעת התלמידים לקראת תקופת הרישום לקורסים.\n7.2.8.1 לוח בחינות אישי – לוח הבחינות האישי של התלמיד יוצג ב\"אתר מידע אישי\" באינטרנט.\n7.2.8.2 מועד בחינה בקורס – יוצג כחלק מפרטי הקורס במסגרת השנתון האוניברסיטאי באתר האינטרנט.\n7.2.8.3 לאחר פרסום לוח המבחנים ועם תום השבוע הראשון בתקופת השינויים של סמסטר א' לא ניתן יהיה לערוך בו שינויים בקורסים שנתיים ובקורסים הנלמדים בסמסטר א'. בקורסים המתחילים בסמסטר ב' יתאפשר שינוי בלוח המבחנים עד לתום השבוע הראשון של תקופת השינויים של סמסטר ב'\n\nנהלי הוראה ולימודים, סעיף נספח ה' סעיף 5 (בחינה):\n5. בחינה\n(א) סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד מיוחד בעבור כל מועד שהפסיד (ראו סעיף ד להלן).\n(ב) סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n• שירות מילואים רצוף של 2-3 ימים: רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך\n24 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 4-6 ימים: רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 7-9 ימים: רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n(ג) סטודנט ששירת שירות מילואים כמפורט להלן, יהיה זכאי להיבחן במועד מיוחד בכל קורס שהיה אמור להיבחן בו בתקופת הבחינות, בהתאם לאמור בסעיף ד' להלן:\n1. שירת 10 ימים לפחות במצטבר במהלך תקופת הבחינות.\n2. במהלך הסמסטר הסמוך לתקופת הבחינות שירת שירות מילואים של 10 ימי מילואים רצופים לפחות או 21 ימים במצטבר.\n3. שירת שירות מילואים בנסיבות חריגות של 5 ימים רצופים לפחות, במהלך תקופת הבחינות או בסמסטר הסמוך לה, או 21 ימים במצטבר במהלך הסמסטר הסמוך לתקופת הבחינות.\n(ד) מועד בחינה מיוחד לפי סעיף זה יתקיים בתוך 45 ימים ממועד הבחינה האחרון בקורס; או במהלך הסמסטר העוקב למועד קיום הבחינה; או במועד אחר שתציע הפקולטה, בהסכמת הסטודנט, שיתקיים לכל המאוחר בשנת הלימודים העוקבת למועד קיום הבחינה; והכול לפי בחירת הסטודנט.\n***יש לפנות לרכז המילואים של פקולטת או לוועדת ההוראה הרלוונטית בבקשות למועד מיוחד***", "ref": "ויתור מבחירה על מועד א: 7.2.6 — בדרך כלל אין מועד מיוחד; מחלה במועד ב אינה נסיבה מנויה מ־(א)–(ו); לכן כנראה לא, או תלוי בוועדה; לא לתת \"כן\" חד."}, {"id": "q9", "q": "I was hospitalized during the first exam sitting. Can I get a special exam date?", "ctx": "נהלי הוראה ולימודים, סעיף 7.4 (מועד בחינה מיוחד):\n7.4.1 המועדים המיוחדים מיועדים לתלמידים שנבצר מהם לגשת למועד הרגיל (לרבות מבחן בית שיש להגישו בתקופה הנכללת במסגרת האירוע המזכה) או למועד הנוסף של הבחינה בשל הנסיבות א'-ו' או שנפגעו על פי סעיף ז' להלן 7.4.2: נסיבות המזכות במועד מיוחד:\n(א) שירות מילואים פעיל -ביום הבחינה; שירות במילואים במשך 10 ימים לפחות במצטבר במהלך תקופת הבחינות; או שירות מילואים במשך יותר מ-9 ימים רצופים או יותר מ-20 ימים במצטבר במהלך הסמסטר בו היה התלמיד רשום לקורס, ובתנאי שהומצאו על כך אישורים מתאימים. סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n1. שירות מילואים רצוף של 2-3 ימים, רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך 24 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקו שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד.\n2. שירות מילואים רצוף של 4-6 ימים, רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד\n3. שירות מילואים רצוף של 7-9 ימים, רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשרות ויהיה זכאי להיבחן במועד מיוחד. . 4. סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד נוסף בעבור כל מועד שהפסיד.\n(ב) חתונה -בחינה המתקיימת ביום החתונה של הסטודנט\n(ג) הורות אירוע מזכה כמפורט בנספח ד' לתקנון זה בסמוך ליום הבחינה או אירוע אחר כמפורט בסעיף ; 1.12.3 כשהבחינה נערכה בתקופת הזכאות שנקבעה לתלמיד/ה על פי אותו סעיף; ובתנאי שהומצאו על כך אישורים מתאימים.\n(ד) צום וחג -בחינה ביום צום או חג מוכרים (כפי שמצוין בלוח האקדמי).\n(ה) אשפוז – בחינה שהתקיימה בתקופת האשפוז של התלמיד או של ילדו/תו עד גיל 18 בבית-חולים (למעט ביקור בחדר מיון/רפואה דחופה), או ביומיים שלאחר שחרורו (של התלמיד או ילדו/תו)לרבות חלופת \"אשפוז בית\" בהתאם להגדרת משרד הבריאות, ובתנאי שהמציא על כך אישורים רפואיים.\n(ו) אבל -בחינה שהתקיימה עד 9 ימים לאחר פטירתו של קרוב משפחה מדרגה ראשונה (הורה, אח/אחות, בן/בת זוג, בן/בת) או עד 3 ימים לאחר פטירת סב/סבתא, ובתנאי שהמציא על כך אישורים מתאימים.\n(ז) חפיפת בחינות – כאשר אחד המועדים של קורס חובה חופף (בפחות מ-24 שעות מסיום הבחינה) עם מועד הבחינה של קורס חובה אחר. תלמיד שנבחן באותו מועד בקורס האחר, זכאי למועד מיוחד בקורס שבו לא נבחן בגין אותה החפיפה. תקנה זו אינה תקפה לקורסים נגררים או לקורסים שהוקדמו.\n(ח) התנהלות שלא על פי התקנון -תלמיד שנפגע מכך שמורה (או מי מטעמו) לא היה זמין בזמן הבחינה (כשהדבר נדרש על פי התקנון; ראה סעיף )7.5.14 או מכך שציון הבחינה שלו התפרסם פחות מ-48 שעות לפני המועד הנוסף.\n(ט) אישור מועדת ההוראה של הפקולטה נותנת הקורס – בשל נסיבות בריאותיות מיוחדות או נסיבות יוצאות דופן אחרות שבגינן נבצר מהתלמיד לגשת לבחינה, ובדרך כלל בתנאי שניגש למועד האחר (הרגיל או הנוסף) של הבחינה.\n7.4.3 בקורס שירות הניתן על ידי פקולטה אחת לאחרת רשאית ועדת ההוראה של הפקולטה הנותנת להסמיך את הפקולטה המקבלת לקבל החלטות בנושא אישור בחינה במועד מיוחד.\n7.4.4 בקשה למועד מיוחד יש להגיש, בצירוף מסמכים מקוריים, לוועדת ההוראה של הפקולטה הנותנת את הקורס וזאת לא יאוחר משבוע אחרי פרסום ציוני הבחינה במועד הנוסף של אותו הקורס. החלטת ועדת ההוראה תימסר לתלמיד בהקדם האפשרי ובכל מקרה לא יאוחר משבוע לפני המועד המיוחד של הבחינה.\n7.4.5 תלמיד שאושרה לו בחינה במועד מיוחד, אבל לא הופיע לבחינה ולא הודיע על כך מראש (עד שבוע לפני מועד הבחינה), יוטל עליו דמי טיפול מיוחד בסך 200 ש\"ח.\n7.4.6 הציון הקובע -בכל מקרה, בין אם נבחן התלמיד במועד הנוסף או במועד המיוחד, ציון הבחינה האחרון הוא הציון הקובע.\n\nנהלי הוראה ולימודים, סעיף 7.2 (מועדי הבחינות, קביעת לוח הבחינות ופרסומו):\n7.2.1 בחינות סיום בקורסי בוגר ומוסמך ייערכו בשני מועדים: מועד רגיל ( מועד א') ומועד נוסף (מועד ב'), שנועד לתת מענה לאילוצים מסיבות אישיות או משיקולים אקדמיים (כגון סמיכות בחינות). התלמיד רשאי לגשת לשני המועדים, ללא קשר לרמת הישגיו בבחינה הקודמת.\n7.2.2 בחינות תתקיימנה במועדים שלא יפגעו במהלך התקין של הלימודים. במקרים מיוחדים, ניתן לקיים את המועד הנוסף (מועד ב) של בחינות סמסטר א' עד תום תקופת השינויים של סמסטר ב'. ציוני כל הקורסים יפורסמו לפני תחילת שנת הלימודים העוקבת.\n7.2.3 המועד הרגיל והנוסף של הבחינה יתקיימו סמוך לסיום הקורס. המועד הרגיל והנוסף של קורס שהסתיים בסמסטר א' יתקיימו בחופשת הסמסטר (בת 6-7 שבועות), ושל קורס שהסתיים בסמסטר ב', במשך ארבעת השבועות הראשונים של חופשת הקיץ.\n7.2.4 המועד הנוסף של בחינה בקורס שהסתיים בסמסטר השני יתקיים בתקופת בחינות של עד\n3 שבועות מתום תקופת המועדים הרגילים בקיץ.\n7.2.5 כל המועדים המיוחדים (ראה סעיף )7.4 שנת הלימודים יתקיימו במהלך השנה או בקיץ כל עוד הם אינם חופפים למועדים האחרים, לא מפריעים למהלך הקיום התקין של הלימודים, והציונים ייקלטו לפני תחילת שנה\"ל העוקבת.\n7.2.6 ככלל, ייגש התלמיד לבחינות במועד הרגיל (מועד א') בכל הקורסים להם הוא רשום באותה שנה. תלמיד שלא ניגש למועד הרגיל לא יהיה זכאי למועד מיוחד על פי סעיפים\n7.4.1 ג' ו -ו'.\n• 7.2.7 כל תלמיד רשאי לגשת למועד הנוסף (מועד ב') ובתנאי שנרשם לבחינה לפחות 3 ימי עבודה לפני הבחינה, ועל פי נהלי הפקולטה. במקרים בהם פורסם ציון המועד הרגיל מאוחר יותר ולא פחות משני ימי עבודה לפני המועד הנוסף, יוכל התלמיד להירשם או לבטל הרשמתו בעזרת המזכירות. כאשר נבחן תלמיד בשנית בקורס, הציון האחרון הוא הקובע. בכפוף לנוהלי הפקולטה, תלמיד שנרשם למועד נוסף (מועד ב') ולא ביטל הרשמתו לבחינה עד 3 ימי עבודה לפני הבחינה, יוטל עליו תשלום דמי טיפול מיוחד בסך 200 ש\"ח.\nחשוב לדעת: -הפקולטה, החוג או מורה הקורס רשאים שלא לאפשר לתלמיד להיבחן במועד הנוסף אם לא נרשם לבחינה על פי נהלי אותה פקולטה. -תלמיד שבחר שלא להיבחן במועד הרגיל ותכנן או ניגש רק למועד הנוסף, יעשה זאת על אחריותו. התלמיד לא יהיה זכאי להיבחן במועד מיוחד למעט מצב בו לא ניגש למבחן במועד הנוסף בשל נסיבות מיוחדות המתוארות בסעיף 7.4.2. אם מדובר בקורס חובה, יהיה עליו לרשום אותו בשנית בשנה בה יוצע הקורס שוב. -אין מחויבות או גם יכולת להבטיח מרווח כזה או אחר בין הבחינות בקורסי בחירה או חובת בחירה, ותיתכן אף חפיפה בלוח הבחינות האישי. המועד הנוסף נועד לספק פתרון לבעיה\nזו. לכן, אין לפנות בבקשה למועד מיוחד בנימוק של צפיפות בלוח הבחינות האישי, למעט על פי סעיף 7.4.1 ו'.\n7.2.8 לוח הבחינות ייקבע מראש ויפורסם לידיעת התלמידים לקראת תקופת הרישום לקורסים.\n7.2.8.1 לוח בחינות אישי – לוח הבחינות האישי של התלמיד יוצג ב\"אתר מידע אישי\" באינטרנט.\n7.2.8.2 מועד בחינה בקורס – יוצג כחלק מפרטי הקורס במסגרת השנתון האוניברסיטאי באתר האינטרנט.\n7.2.8.3 לאחר פרסום לוח המבחנים ועם תום השבוע הראשון בתקופת השינויים של סמסטר א' לא ניתן יהיה לערוך בו שינויים בקורסים שנתיים ובקורסים הנלמדים בסמסטר א'. בקורסים המתחילים בסמסטר ב' יתאפשר שינוי בלוח המבחנים עד לתום השבוע הראשון של תקופת השינויים של סמסטר ב'\n\nנהלי הוראה ולימודים, סעיף נספח ה' סעיף 5 (בחינה):\n5. בחינה\n(א) סטודנט שנעדר מבחינה בשל שירות מילואים זכאי להיבחן במועד מיוחד בעבור כל מועד שהפסיד (ראו סעיף ד להלן).\n(ב) סטודנט ששירת שירות מילואים ברצף במשך 2-9 ימים במהלך תקופת הבחינות או בסמוך לה (דהיינו החל את שירות המילואים לפני תקופת הבחינות וסיים במהלכה) זכאי לא לגשת לבחינה המתקיימת בסמוך לחזרתו ולקבל מועד מיוחד על פי המפתח הבא:\n• שירות מילואים רצוף של 2-3 ימים: רשאי התלמיד לא להיבחן בבחינה המתקיימת במהלך\n24 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 4-6 ימים: רשאי התלמיד לא להיבחן במהלך 48 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n• שירות מילואים רצוף של 7-9 ימים: רשאי התלמיד לא להיבחן במהלך 72 שעות לאחר חזרתו מהשירות ויהיה זכאי להיבחן במועד מיוחד.\n(ג) סטודנט ששירת שירות מילואים כמפורט להלן, יהיה זכאי להיבחן במועד מיוחד בכל קורס שהיה אמור להיבחן בו בתקופת הבחינות, בהתאם לאמור בסעיף ד' להלן:\n1. שירת 10 ימים לפחות במצטבר במהלך תקופת הבחינות.\n2. במהלך הסמסטר הסמוך לתקופת הבחינות שירת שירות מילואים של 10 ימי מילואים רצופים לפחות או 21 ימים במצטבר.\n3. שירת שירות מילואים בנסיבות חריגות של 5 ימים רצופים לפחות, במהלך תקופת הבחינות או בסמסטר הסמוך לה, או 21 ימים במצטבר במהלך הסמסטר הסמוך לתקופת הבחינות.\n(ד) מועד בחינה מיוחד לפי סעיף זה יתקיים בתוך 45 ימים ממועד הבחינה האחרון בקורס; או במהלך הסמסטר העוקב למועד קיום הבחינה; או במועד אחר שתציע הפקולטה, בהסכמת הסטודנט, שיתקיים לכל המאוחר בשנת הלימודים העוקבת למועד קיום הבחינה; והכול לפי בחירת הסטודנט.\n***יש לפנות לרכז המילואים של פקולטת או לוועדת ההוראה הרלוונטית בבקשות למועד מיוחד***", "ref": "نعم (7.4.2، אשפוז)، بشرط المستندات، طلب للجنة التدريس (7.4.4)؛ الإجابة بالعربية."}];
const SYS = 'אתם עוזר של אגודת הסטודנטים באוניברסיטה העברית שעונה על שאלות על התקנונים. ענו רק לפי הסעיפים שמצורפים. השורה הראשונה היא תשובה ישירה וקצרה (כן / לא / תלוי, והמועד אם יש). אחר כך הסבר קצר עם ציטוט מדויק במירכאות ומספר סעיף. אם חסר מידע שמשנה את התשובה, שאלו שאלה אחת. אל תמציאו מועדים או כללים שלא כתובים בסעיפים. סיימו בשורה "הצעד הבא:". ענו בשפת השאלה; ציטוטים נשארים בעברית.';
const results = [];
document.getElementById('models').value = (localStorage.getItem('cmp-models') || '').trim();
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('go').onclick = async () => {
  const models = document.getElementById('models').value.split('\n').map(s => s.trim()).filter(Boolean);
  try { localStorage.setItem('cmp-models', models.join('\n')); } catch (_) {}
  if (!models.length) return;
  const t = document.getElementById('t');
  t.innerHTML = '<tr><th>שאלה</th>' + models.map(m => '<th>' + esc(m) + '</th>').join('') + '</tr>' + CASES.map(c => '<tr><td>' + esc(c.q) + '<div class="ref">צפוי: ' + esc(c.ref) + '</div></td>' + models.map((m, j) => '<td id="c-' + c.id + '-' + j + '">…</td>').join('') + '</tr>').join('') + '<tr><th>עלות כוללת ($)</th>' + models.map((m, j) => '<td id="sum-' + j + '"></td>').join('') + '</tr>';
  results.length = 0; const sums = models.map(() => 0); let done = 0; const total = models.length * CASES.length;
  const st = document.getElementById('st');
  await Promise.all(models.map(async (m, j) => {
    for (const c of CASES) {
      const cell = document.getElementById('c-' + c.id + '-' + j); const t0 = Date.now();
      try {
        const r = await fetch(API + '?test=1', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ model: m, stream: false, input: [{ role: 'system', content: SYS }, { role: 'user', content: 'הסעיפים:\n\n' + c.ctx + '\n\nהשאלה: ' + c.q }] }) });
        const txt = await r.text(); let j2 = {}; try { j2 = JSON.parse(txt); } catch (_) {}
        const a = (j2.choices && j2.choices[0] && j2.choices[0].message && j2.choices[0].message.content) || ('שגיאה ' + r.status + ': ' + txt.slice(0, 300));
        const u = j2.usage || {}; const cost = Number(u.cost || 0); sums[j] += cost;
        const sec = (Date.now() - t0) / 1000;
        cell.innerHTML = '<div class="ans">' + esc(a) + '</div><div class="ref">' + sec.toFixed(1) + ' שנ׳ · ' + (u.prompt_tokens || '?') + '/' + (u.completion_tokens || '?') + ' טוקנים · $' + cost.toFixed(5) + '</div>';
        results.push({ model: m, id: c.id, q: c.q, answer: a, seconds: sec, usage: u });
      } catch (e) { cell.textContent = 'שגיאה: ' + e.message; results.push({ model: m, id: c.id, error: String(e) }); }
      document.getElementById('sum-' + j).textContent = sums[j].toFixed(4);
      st.textContent = (++done) + ' מתוך ' + total;
    }
  }));
  st.textContent = 'הסתיים. לחצו "העתקת התוצאות" ושלחו לקלוד.';
};
document.getElementById('copy').onclick = async () => {
  const s = JSON.stringify(results); try { await navigator.clipboard.writeText(s); document.getElementById('st').textContent = 'הועתק (' + results.length + ' תשובות)'; } catch (_) { const w = window.open(); w.document.body.innerText = s; }
};
</script></body></html>
